[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boston-sim"
version = "0.1.0"
description = "Parcel preparation, accessibility, and hedonic modeling workflows for Boston simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "networkx>=3.0",
  "osmnx>=1.9",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "libpysal>=4.10",
  "spreg>=1.8",
  "matplotlib>=3.8",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "biogeme>=3.3.2",
]

[tool.setuptools]
include-package-data = false
