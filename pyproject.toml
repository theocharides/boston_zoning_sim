[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boston-zoning-sim"
version = "0.1.0"
description = "Boston zoning simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "networkx>=3.0",
  "osmnx>=1.9",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "certifi>=2023.0",   # CA bundle for Census/TIGER HTTPS (Windows cert store)
  "pyogrio>=0.8",      # fast GeoJSON/shapefile engine for geopandas
  "pyarrow>=12.0",     # parquet engine for pandas/geopandas
  "biogeme>=3.3.2",    # developer-choice multinomial/nested logit (planned)
]

[tool.setuptools]
include-package-data = false
